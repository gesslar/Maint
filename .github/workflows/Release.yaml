# Release - Reusable Workflow
#
# This workflow automates the release process when a PR is merged. It waits for quality
# checks, determines if a version bump occurred, creates a git tag, generates a GitHub
# release, and publishes to npm.
#
# INPUTS:
#   package_manager (string, default: "auto")
#     Package manager to use. Set to "auto" to detect from package.json, or specify
#     "npm" or "pnpm" explicitly.
#
#   quality_check (string, default: "Quality")
#     Name of the quality workflow to wait for before proceeding with release.
#     Set to empty string "" to skip waiting for quality checks.
#
#   git_user_name (string, default: "github-actions")
#     Git user name for creating tags and commits.
#
#   git_user_email (string, default: "github-actions@github.com")
#     Git user email for creating tags and commits.
#
# REPOSITORY VARIABLES (optional, no commit needed):
#   All inputs can be overridden by repository variables. Set these in your repository
#   settings under Settings → Secrets and variables → Actions → Variables tab.
#
#   PACKAGE_MANAGER
#     Overrides package_manager input if set.
#
#   QUALITY_CHECK
#     Overrides quality_check input if set.
#
#   GIT_USER_NAME
#     Overrides git_user_name input if set.
#
#   GIT_USER_EMAIL
#     Overrides git_user_email input if set.
#
# SECRETS (required):
#   NPM_GITHUB_CD_ACCESS_TOKEN
#     npm authentication token for publishing packages.
#     Create at https://www.npmjs.com/settings/[username]/tokens
#     Set in repository settings under Secrets and variables → Actions.
#
# EXAMPLE USAGE:
#   jobs:
#     release:
#       uses: ./.github/workflows/Release.yaml
#       with:
#         quality_check: "Quality"
#         git_user_name: "github-actions"
#         git_user_email: "github-actions@github.com"
#       secrets:
#         NPM_GITHUB_CD_ACCESS_TOKEN: ${{ secrets.NPM_GITHUB_CD_ACCESS_TOKEN }}

name: Release (Reusable)

on:
  workflow_call:
    inputs:
      package_manager:
        type: string
        default: "auto"
      quality_check:
        description: "Name of quality workflow to wait for"
        type: string
        default: "Quality"
      git_user_name:
        type: string
        default: "github-actions"
      git_user_email:
        type: string
        default: "github-actions@github.com"
    secrets:
      NPM_GITHUB_CD_ACCESS_TOKEN:
        required: true

jobs:
  ConfigureWorkflow:
    runs-on: ubuntu-latest

    outputs:
      quality_check: ${{ steps.cfg_main.outputs.quality_check }}
      git_user_name: ${{ steps.cfg_main.outputs.git_user_name }}
      git_user_email: ${{ steps.cfg_main.outputs.git_user_email }}
      package_manager: ${{ steps.cfg_pm.outputs.package_manager }}
      pm_install_cmd: ${{ steps.cfg_pm.outputs.pm_install_cmd }}
      pm_default: ${{ steps.cfg_main.outputs.pm_default }}
      pm_version: ${{ steps.cfg_pm.outputs.pm_version }}
      node_version: ${{ steps.cfg_node.outputs.node_version }}

    steps:
      - name: Configure workflow
        id: cfg_main
        run: |+
          # Check repository variables, fall back to inputs
          QUALITY_CHECK="${{ vars.QUALITY_CHECK || inputs.quality_check }}"
          PACKAGE_MANAGER="${{ vars.PACKAGE_MANAGER || inputs.package_manager }}"
          GIT_USER_NAME="${{ vars.GIT_USER_NAME || inputs.git_user_name }}"
          GIT_USER_EMAIL="${{ vars.GIT_USER_EMAIL || inputs.git_user_email }}"

          # Apply configuration
          echo "quality_check=${QUALITY_CHECK}" >> "$GITHUB_OUTPUT"
          echo "git_user_name=${GIT_USER_NAME}" >> "$GITHUB_OUTPUT"
          echo "git_user_email=${GIT_USER_EMAIL}" >> "$GITHUB_OUTPUT"
          echo "package_manager=${PACKAGE_MANAGER}" >> "$GITHUB_OUTPUT"
          echo "pm_default=npm" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Package Manager
        id: cfg_pm
        run: |+
          set -euo pipefail

          PM_DEFAULT="${{ steps.cfg_main.outputs.pm_default }}"
          PACKAGE_MANAGER="${{ steps.cfg_main.outputs.package_manager }}"
          PM_VERSION=""

          if [[ "$PACKAGE_MANAGER" = "auto" ]]; then
            printf "Package manager set to 'auto'.\n"
            printf "Detecting: "

            PM=$(jq -r .packageManager package.json)
            printf "PM=%s\n" "$PM"

            if [[ ! "$PM" ]]; then
              PACKAGE_MANAGER="$PM_DEFAULT"
            elif [[ "$PM" =~ ^(pnpm)@([[:digit:]]+.[[:digit:]]+.[[:digit:]]+)$ ]]; then
              PACKAGE_MANAGER="${BASH_REMATCH[1]}"
              PM_VERSION="${BASH_REMATCH[2]}"
            else
              PACKAGE_MANAGER="$PM_DEFAULT"
              PM_VERSION=""
            fi
          fi

          echo "package_manager=${PACKAGE_MANAGER}" >> "$GITHUB_OUTPUT"
          echo "pm_version=${PM_VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "$PACKAGE_MANAGER" = "pnpm" ]]; then
            echo "pm_install_cmd=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          else
            echo "pm_install_cmd=npm ci" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Node Version
        id: cfg_node
        run: |+
          set -euo pipefail

          NODE_VERSION=""

          if ! NODE_RAW=$(jq -er '.engines.node' package.json); then
            echo "::error::engines.node is required in package.json."
            exit 1
          fi

          if [[ "$NODE_RAW" =~ [^0-9]*([0-9]+) ]]; then
            NODE_VERSION="${BASH_REMATCH[1]}"
          else
            echo "::error::Unable to parse engines.node ('${NODE_RAW}') for a Node.js version."
            exit 1
          fi

          echo "node_version=${NODE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Display Configuration
        run: |+
          printf "Package Manager: %s" "${{ steps.cfg_pm.outputs.package_manager }}"

          if [[ "${{ steps.cfg_pm.outputs.package_manager }}" = "pnpm" ]]; then
            printf " (%s)\n" "${{ steps.cfg_pm.outputs.pm_version }}"
          else
            printf "\n"
          fi

          printf "Package Manager Install: %s\n" "${{ steps.cfg_pm.outputs.pm_install_cmd }}"
          printf "Node: %s\n" "${{ steps.cfg_node.outputs.node_version }}"

  WaitForQuality:
    needs: ConfigureWorkflow
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged == true }}
    steps:
      - name: Wait for Quality workflow
        if: ${{ inputs.quality_check != '' }}
        uses: lewagon/wait-on-check-action@v1.6.1
        with:
          ref: ${{ github.ref }}
          check-name: ${{ inputs.quality_check }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

  DetermineVersion:
    needs: WaitForQuality
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged == true }}
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check version
        id: check_version
        uses: gesslar/new-version-questionmark@v1.6.2
        with:
          source: package.json
          version_pattern: "^v\\d+\\.\\d+\\.\\d+$"

      - name: Set version output
        id: version
        run: |
          UPDATED_VERSION="${{ steps.check_version.outputs.updated_version }}"
          if [[ "$UPDATED_VERSION" == "no changes" ]]; then
            echo "VERSION=🙅🏻‍♂️" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${UPDATED_VERSION}" >> "$GITHUB_OUTPUT"
          fi

  CreateTag:
    needs: [ConfigureWorkflow, DetermineVersion]
    if: ${{ needs.DetermineVersion.outputs.version != '🙅🏻‍♂️' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      new_tag: ${{ steps.check_tag.outputs.new_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        if: ${{ needs.ConfigureWorkflow.outputs.package_manager == 'pnpm' }}
        uses: pnpm/action-setup@v6
        with:
          version: ${{ needs.ConfigureWorkflow.outputs.pm_version }}

      - name: Setup Git Variables
        run: |+
          git config user.name "${{ needs.ConfigureWorkflow.outputs.git_user_name }}"
          git config user.email "${{ needs.ConfigureWorkflow.outputs.git_user_email }}"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.ConfigureWorkflow.outputs.node_version }}
          cache: ${{ needs.ConfigureWorkflow.outputs.package_manager }}

      - name: Install dependencies
        run: ${{ needs.ConfigureWorkflow.outputs.pm_install_cmd }}

      - name: Read version from package.json
        id: get_version
        run: |
          CURRENT_VERSION=${{ needs.DetermineVersion.outputs.version }}

      - name: Fetch all tags
        run: git fetch --tags

      - name: Check for existing tag and create if it does not exist
        id: check_tag
        run: |+
          CURRENT_VERSION="${{ needs.DetermineVersion.outputs.version }}"
          TAG_EXISTS=$(git tag -l "v${CURRENT_VERSION}")

          echo "Value of TAG_EXISTS: $TAG_EXISTS"

          if [ -z "$TAG_EXISTS" ]; then
            echo "Tag does not exist for version v${CURRENT_VERSION}. Creating tag."
            git tag "v${CURRENT_VERSION}"
            git push origin "v${CURRENT_VERSION}"
            echo "new_tag=v${CURRENT_VERSION}" >> $GITHUB_OUTPUT
          else
            echo "Tag already exists for version v${CURRENT_VERSION}. Skipping tag creation."
            echo "new_tag=🙅🏻‍♂️" >> $GITHUB_OUTPUT
            exit 0
          fi

  CreateGitHubRelease:
    needs: [ConfigureWorkflow, CreateTag]
    runs-on: ubuntu-latest
    if: ${{ needs.CreateTag.outputs.new_tag != '🙅🏻‍♂️' }}

    permissions:
      contents: write

    env:
      NEW_TAG: ${{ needs.CreateTag.outputs.new_tag }}

    steps:
      - name: Setup New Tag
        run: |
          echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        if: ${{ needs.ConfigureWorkflow.outputs.package_manager == 'pnpm' }}
        uses: pnpm/action-setup@v6
        with:
          version: ${{ needs.ConfigureWorkflow.outputs.pm_version }}

      - name: Setup Git Variables
        run: |
          git config user.name "${{ needs.ConfigureWorkflow.outputs.git_user_name }}"
          git config user.email "${{ needs.ConfigureWorkflow.outputs.git_user_email }}"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.ConfigureWorkflow.outputs.node_version }}
          cache: ${{ needs.ConfigureWorkflow.outputs.package_manager }}

      - name: Install dependencies
        run: ${{ needs.ConfigureWorkflow.outputs.pm_install_cmd }}

      - name: Build artefact
        run: |
          ARTEFACT=$(${{ needs.ConfigureWorkflow.outputs.package_manager }} pack | tail -1)
          echo "ARTEFACT=${ARTEFACT}" >> $GITHUB_ENV

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          set -x;
          gh release create "${{ env.NEW_TAG }}"
          --title "Release ${{ env.NEW_TAG }}"
          --generate-notes
          "${{ env.ARTEFACT }}"

  PublishToNPM:
    needs: [ConfigureWorkflow, DetermineVersion]
    if: ${{ needs.DetermineVersion.outputs.version != '🙅🏻‍♂️' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      TOKEN: ${{ secrets.NPM_GITHUB_CD_ACCESS_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        if: ${{ needs.ConfigureWorkflow.outputs.package_manager == 'pnpm' }}
        uses: pnpm/action-setup@v6
        with:
          version: ${{ needs.ConfigureWorkflow.outputs.pm_version }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.ConfigureWorkflow.outputs.node_version }}
          cache: ${{ needs.ConfigureWorkflow.outputs.package_manager }}

      - name: Install dependencies
        run: ${{ needs.ConfigureWorkflow.outputs.pm_install_cmd }}

      - name: Check NPM version and compare
        id: check_npm_version
        run: |
          set -euo pipefail

          NEW_VERSION="${{ needs.DetermineVersion.outputs.version }}"
          PACKAGE_NAME=$(jq -r .name package.json)

          echo "Checking NPM for package: ${PACKAGE_NAME}"
          echo "New version to publish: ${NEW_VERSION}"

          # Check if the exact version already exists on NPM
          if npm view "${PACKAGE_NAME}@${NEW_VERSION}" version >/dev/null 2>&1; then
            NPM_VERSION=$(npm view "${PACKAGE_NAME}" version)
            echo "Version ${NEW_VERSION} already exists on NPM (latest: ${NPM_VERSION})"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "npm_version=${NPM_VERSION}" >> "$GITHUB_OUTPUT"
            echo "version_exists=true" >> "$GITHUB_OUTPUT"
          else
            # Get the latest version from NPM
            if NPM_VERSION=$(npm view "${PACKAGE_NAME}" version 2>/dev/null); then
              echo "Current NPM version: ${NPM_VERSION}"

              # Use node with semver (available via npm) to compare versions
              COMPARE_RESULT=$(node -e "
                try {
                  const semver = require('semver');
                  const newVer = process.argv[1];
                  const npmVer = process.argv[2];
                  if (semver.gt(newVer, npmVer)) {
                    console.log('greater');
                  } else {
                    console.log('not-greater');
                  }
                } catch (e) {
                  // Fallback: if semver not available, proceed with publish
                  console.log('greater');
                }
              " "${NEW_VERSION}" "${NPM_VERSION}")

              if [ "$COMPARE_RESULT" = "greater" ]; then
                echo "New version ${NEW_VERSION} is greater than NPM version ${NPM_VERSION}"
                echo "should_publish=true" >> "$GITHUB_OUTPUT"
                echo "npm_version=${NPM_VERSION}" >> "$GITHUB_OUTPUT"
                echo "version_exists=false" >> "$GITHUB_OUTPUT"
              else
                echo "New version ${NEW_VERSION} is not greater than NPM version ${NPM_VERSION}"
                echo "should_publish=false" >> "$GITHUB_OUTPUT"
                echo "npm_version=${NPM_VERSION}" >> "$GITHUB_OUTPUT"
                echo "version_exists=false" >> "$GITHUB_OUTPUT"
              fi
            else
              # Package doesn't exist on NPM yet, proceed with publish
              echo "Package not found on NPM, proceeding with publish"
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
              echo "npm_version=" >> "$GITHUB_OUTPUT"
              echo "version_exists=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Skip publish annotation
        if: steps.check_npm_version.outputs.should_publish == 'false'
        run: |
          NEW_VERSION="${{ needs.DetermineVersion.outputs.version }}"
          NPM_VERSION="${{ steps.check_npm_version.outputs.npm_version }}"
          VERSION_EXISTS="${{ steps.check_npm_version.outputs.version_exists }}"

          if [ "$VERSION_EXISTS" = "true" ]; then
            echo "::notice title=Version Check::Skipping NPM publish: version ${NEW_VERSION} already exists on NPM (latest: ${NPM_VERSION})."
          else
            echo "::notice title=Version Check::Skipping NPM publish: version ${NEW_VERSION} is not greater than NPM version ${NPM_VERSION}."
          fi

      - name: Ship it
        if: steps.check_npm_version.outputs.should_publish == 'true'
        run: |
          ${{ needs.ConfigureWorkflow.outputs.package_manager }} publish --access public --//registry.npmjs.org/:_authToken=${TOKEN}

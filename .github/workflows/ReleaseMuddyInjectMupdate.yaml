name: Build Mudlet package with Mupdate and publish release

# Thin alias: delegates to ReleaseMudlet.yaml with `inject_mupdate: true`.
#
# This file exists to preserve the historical name and input surface that
# existing callers reference. The actual build + release logic (including
# the optional Quality gate) lives in ReleaseMudlet.yaml. New Mudlet
# packages should prefer calling ReleaseMudlet.yaml directly and opting
# into Mupdate via `inject_mupdate: true` if they need the auto-updater.
#
# About Mupdate:
#   Mupdate is a self-updater for Mudlet packages. This workflow downloads
#   the latest Updater.lua from https://github.com/gesslar/mupdate and
#   splices it into your package's scripts.json at build time. For runtime
#   integration — how to initialize it, trigger update checks, expose user
#   commands — see the project README at the URL above.
#
# EXAMPLE USAGE (legacy):
#   jobs:
#     release:
#       uses: gesslar/Maint/.github/workflows/ReleaseMuddyInjectMupdate.yaml@main
#       permissions:
#         contents: write
#       with:
#         quality_check: "Quality / Quality"

on:
  workflow_call:
    inputs:
      quality_check:
        description: "Name of quality check to wait for (composite: '<caller-job> / <sentinel-job>'). Empty string disables the gate."
        type: string
        default: "Quality / Quality"

jobs:
  release:
    uses: gesslar/Maint/.github/workflows/ReleaseMudlet.yaml@main
    permissions:
      contents: write
    with:
      quality_check: ${{ inputs.quality_check }}
      inject_mupdate: true

# Quality - Reusable Workflow
#
# This workflow performs linting and testing on your code across multiple operating
# systems and Node.js versions.
#
# INPUTS:
#   package_manager (string, default: "auto")
#     Package manager to use. Set to "auto" to detect from package.json, or specify
#     "npm" or "pnpm" explicitly.
#
#   perform_linting (string, default: "yes")
#     Whether to run the lint job. Set to "no" to skip linting.
#
#   perform_testing (string, default: "yes")
#     Whether to run the test job. Set to "no" to skip testing.
#
#   disabled_test_runners (string, default: "")
#     Comma-separated list of OS runners to exclude from testing.
#     Examples: "windows", "macos", "windows,macos"
#     Supported values: ubuntu, windows, macos
#
#   disabled_node_versions (string, default: "")
#     Comma-separated list of Node.js versions to exclude from testing.
#     Examples: "24", "24,25"
#     Supported values: 22, 23, 24, 25
#
# REPOSITORY VARIABLES (optional, no commit needed):
#   All inputs can be overridden by repository variables. Set these in your repository
#   settings under Settings → Secrets and variables → Actions → Variables tab.
#
#   PACKAGE_MANAGER
#     Overrides package_manager input if set.
#
#   PERFORM_LINTING
#     Overrides perform_linting input if set.
#
#   PERFORM_TESTING
#     Overrides perform_testing input if set.
#
#   DISABLED_TEST_RUNNERS
#     Combines with disabled_test_runners input (both applied if set).
#
#   DISABLED_NODE_VERSIONS
#     Combines with disabled_node_versions input (both applied if set).
#
# EXAMPLE USAGE:
#   jobs:
#     quality:
#       uses: ./.github/workflows/Quality.yaml
#       with:
#         disabled_test_runners: "windows"
#         disabled_node_versions: "24"
#         perform_linting: "yes"
#         perform_testing: "yes"

name: Quality

on:
  workflow_call:
    inputs:
      package_manager:
        type: string
        default: "auto"
      perform_linting:
        type: string
        default: "yes"
      perform_testing:
        type: string
        default: "yes"
      disabled_test_runners:
        type: string
        default: ""
        description: "Comma-separated list of OS runners to exclude (e.g., 'windows,macos')"
      disabled_node_versions:
        type: string
        default: ""
        description: "Comma-separated list of Node versions to exclude (e.g., '24,25')"

jobs:
  ConfigureWorkflow:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      perform_linting: ${{ steps.cfg_main.outputs.perform_linting }}
      perform_testing: ${{ steps.cfg_main.outputs.perform_testing }}
      package_manager: ${{ steps.cfg_pm.outputs.package_manager }}
      pm_install_cmd: ${{ steps.cfg_pm.outputs.pm_install_cmd }}
      pm_version: ${{ steps.cfg_pm.outputs.pm_version }}
      node_version: ${{ steps.cfg_node.outputs.node_version }}
      os_matrix: ${{ steps.cfg_os.outputs.os_matrix }}
      node_version_matrix: ${{ steps.cfg_node_versions.outputs.node_version_matrix }}

    steps:
      - name: Configure Main
        id: cfg_main
        run: |
          # Check repository variables, fall back to inputs
          PERFORM_LINTING="${{ vars.PERFORM_LINTING || inputs.perform_linting }}"
          PERFORM_TESTING="${{ vars.PERFORM_TESTING || inputs.perform_testing }}"

          echo "perform_linting=${PERFORM_LINTING}" >> "$GITHUB_OUTPUT"
          echo "perform_testing=${PERFORM_TESTING}" >> "$GITHUB_OUTPUT"
          echo "pm_default=npm" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure Package Manager
        id: cfg_pm
        run: |
          set -euo pipefail

          PM_DEFAULT="npm"
          # Check repository variable, fall back to input
          PACKAGE_MANAGER="${{ vars.PACKAGE_MANAGER || inputs.package_manager }}"
          PM_VERSION=""

          if [[ "$PACKAGE_MANAGER" = "auto" ]]; then
            PM=$(jq -r .packageManager package.json)

            if [[ ! "$PM" ]]; then
              PACKAGE_MANAGER="$PM_DEFAULT"
            elif [[ "$PM" =~ ^(pnpm)@([[:digit:]]+.[[:digit:]]+.[[:digit:]]+)$ ]]; then
              PACKAGE_MANAGER="${BASH_REMATCH[1]}"
              PM_VERSION="${BASH_REMATCH[2]}"
            else
              PACKAGE_MANAGER="$PM_DEFAULT"
            fi
          fi

          echo "package_manager=${PACKAGE_MANAGER}" >> "$GITHUB_OUTPUT"
          echo "pm_version=${PM_VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "$PACKAGE_MANAGER" = "pnpm" ]]; then
            echo "pm_install_cmd=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          else
            echo "pm_install_cmd=npm ci" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Node Version
        id: cfg_node
        run: |
          set -euo pipefail

          if ! NODE_RAW=$(jq -er '.engines.node' package.json); then
            echo "::error::engines.node is required in package.json."
            exit 1
          fi

          if [[ "$NODE_RAW" =~ [^0-9]*([0-9]+) ]]; then
            NODE_VERSION="${BASH_REMATCH[1]}"
          else
            echo "::error::Unable to parse engines.node"
            exit 1
          fi

          echo "node_version=${NODE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Configure OS Matrix
        id: cfg_os
        run: |
          set -euo pipefail

          ALL_OS=("ubuntu-latest" "windows-latest" "macos-latest")

          # Combine input and repository variable
          DISABLED_INPUT="${{ inputs.disabled_test_runners }}"
          DISABLED_VAR="${{ vars.DISABLED_TEST_RUNNERS }}"

          if [[ -n "$DISABLED_INPUT" && -n "$DISABLED_VAR" ]]; then
            DISABLED="${DISABLED_INPUT},${DISABLED_VAR}"
          elif [[ -n "$DISABLED_VAR" ]]; then
            DISABLED="$DISABLED_VAR"
          else
            DISABLED="$DISABLED_INPUT"
          fi

          if [[ -z "$DISABLED" ]]; then
            OS_LIST=("${ALL_OS[@]}")
          else
            IFS=',' read -ra DISABLED_ARRAY <<< "$DISABLED"
            OS_LIST=()
            for os in "${ALL_OS[@]}"; do
              SKIP=false
              for disabled in "${DISABLED_ARRAY[@]}"; do
                disabled=$(echo "$disabled" | xargs)
                if [[ "$os" == *"$disabled"* ]]; then
                  SKIP=true
                  break
                fi
              done
              if [[ "$SKIP" == "false" ]]; then
                OS_LIST+=("$os")
              fi
            done
          fi

          if [[ ${#OS_LIST[@]} -eq 0 ]]; then
            echo "::error::All test runners have been disabled"
            exit 1
          fi

          JSON=$(printf '%s\n' "${OS_LIST[@]}" | jq -R . | jq -s -c .)
          echo "os_matrix=${JSON}" >> "$GITHUB_OUTPUT"
          echo "os_list=${OS_LIST[*]}" >> "$GITHUB_OUTPUT"
          echo "disabled_os=${DISABLED:-<none>}" >> "$GITHUB_OUTPUT"

      - name: Configure Node Version Matrix
        id: cfg_node_versions
        run: |
          set -euo pipefail

          ALL_NODE_VERSIONS=("24.x" "25.x")

          # Combine input and repository variable
          DISABLED_INPUT="${{ inputs.disabled_node_versions }}"
          DISABLED_VAR="${{ vars.DISABLED_NODE_VERSIONS }}"

          if [[ -n "$DISABLED_INPUT" && -n "$DISABLED_VAR" ]]; then
            DISABLED="${DISABLED_INPUT},${DISABLED_VAR}"
          elif [[ -n "$DISABLED_VAR" ]]; then
            DISABLED="$DISABLED_VAR"
          else
            DISABLED="$DISABLED_INPUT"
          fi

          if [[ -z "$DISABLED" ]]; then
            NODE_LIST=("${ALL_NODE_VERSIONS[@]}")
          else
            IFS=',' read -ra DISABLED_ARRAY <<< "$DISABLED"
            NODE_LIST=()
            for node in "${ALL_NODE_VERSIONS[@]}"; do
              SKIP=false
              for disabled in "${DISABLED_ARRAY[@]}"; do
                disabled=$(echo "$disabled" | xargs)
                if [[ "$node" == *"$disabled"* ]]; then
                  SKIP=true
                  break
                fi
              done
              if [[ "$SKIP" == "false" ]]; then
                NODE_LIST+=("$node")
              fi
            done
          fi

          if [[ ${#NODE_LIST[@]} -eq 0 ]]; then
            echo "::error::All Node versions have been disabled"
            exit 1
          fi

          JSON=$(printf '%s\n' "${NODE_LIST[@]}" | jq -R . | jq -s -c .)
          echo "node_version_matrix=${JSON}" >> "$GITHUB_OUTPUT"
          echo "node_list=${NODE_LIST[*]}" >> "$GITHUB_OUTPUT"
          echo "disabled_node=${DISABLED:-<none>}" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          cat <<'EOF'
          Quality Workflow Configuration
          ═══════════════════════════════════════════════════════════════
          Package Manager ......... ${{ steps.cfg_pm.outputs.package_manager }}
          Perform Linting ......... ${{ steps.cfg_main.outputs.perform_linting }}
          Perform Testing ......... ${{ steps.cfg_main.outputs.perform_testing }}
          Node Version (lint) ..... ${{ steps.cfg_node.outputs.node_version }}
          OS Matrix ............... ${{ steps.cfg_os.outputs.os_list }}
          Node Version Matrix ..... ${{ steps.cfg_node_versions.outputs.node_list }}
          Disabled OS ............. ${{ steps.cfg_os.outputs.disabled_os }}
          Disabled Node Versions .. ${{ steps.cfg_node_versions.outputs.disabled_node }}
          EOF

  Lint:
    needs: ConfigureWorkflow
    if: ${{ needs.ConfigureWorkflow.outputs.perform_linting == 'yes' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        if: ${{ needs.ConfigureWorkflow.outputs.package_manager == 'pnpm' }}
        uses: pnpm/action-setup@v6.0.10
        with:
          version: ${{ needs.ConfigureWorkflow.outputs.pm_version }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ needs.ConfigureWorkflow.outputs.node_version }}
          cache: ${{ needs.ConfigureWorkflow.outputs.package_manager }}

      - run: ${{ needs.ConfigureWorkflow.outputs.pm_install_cmd }}

      - run: ${{ needs.ConfigureWorkflow.outputs.package_manager }} run lint

  Test:
    needs: ConfigureWorkflow
    if: ${{ needs.ConfigureWorkflow.outputs.perform_testing == 'yes' }}
    strategy:
      matrix:
        os: ${{ fromJSON(needs.ConfigureWorkflow.outputs.os_matrix) }}
        node-version: ${{ fromJSON(needs.ConfigureWorkflow.outputs.node_version_matrix) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        if: ${{ needs.ConfigureWorkflow.outputs.package_manager == 'pnpm' }}
        uses: pnpm/action-setup@v6.0.10
        with:
          version: ${{ needs.ConfigureWorkflow.outputs.pm_version }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ needs.ConfigureWorkflow.outputs.package_manager }}

      - run: ${{ needs.ConfigureWorkflow.outputs.pm_install_cmd }}
        shell: bash

      - run: ${{ needs.ConfigureWorkflow.outputs.package_manager }} test
        shell: bash

  Quality:
    needs: [ConfigureWorkflow, Lint, Test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify upstream jobs
        run: |
          set -euo pipefail
          results='${{ toJSON(needs) }}'
          echo "$results" | jq .
          echo "$results" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'

# Release Action - Reusable Workflow
#
# This workflow automates the release process for a JavaScript GitHub Action when a PR
# is merged. Unlike Release.yaml (which publishes to npm) and ReleaseOnly.yaml (which is
# ecosystem-agnostic and attaches pre-built artefacts), this workflow is purpose-built
# for Actions that ship a bundled `dist/` committed to the repository.
#
# It waits for quality checks, determines if a version bump occurred, builds the action
# bundle, commits the freshly built bundle back to main, and ONLY THEN creates the git
# tag and GitHub release. Tagging after the build commit guarantees that consumers who
# pin `uses: owner/action@vX.Y.Z` get the dist that matches that version.
#
# INPUTS:
#   package_manager (string, default: "auto")
#     Package manager to use. Set to "auto" to detect from package.json, or specify
#     "npm" or "pnpm" explicitly.
#
#   quality_check (string, default: "Quality / Quality")
#     Name of the quality check to wait for (composite: '<caller-job> / <sentinel-job>').
#     Set to empty string "" to skip waiting for quality checks.
#
#   git_user_name (string, default: "github-actions")
#     Git user name for creating tags and the dist commit.
#
#   git_user_email (string, default: "github-actions@github.com")
#     Git user email for creating tags and the dist commit.
#
#   build_command (string, default: "build")
#     Package script to run (invoked as '<package_manager> run <build_command>') that
#     produces the bundled action.
#
#   dist_path (string, default: "dist")
#     Path to the built action output that gets committed back to the repository.
#
# REPOSITORY VARIABLES (optional, no commit needed):
#   All inputs can be overridden by repository variables. Set these in your repository
#   settings under Settings → Secrets and variables → Actions → Variables tab.
#
#   PACKAGE_MANAGER, QUALITY_CHECK, GIT_USER_NAME, GIT_USER_EMAIL, BUILD_COMMAND, DIST_PATH
#
# EXAMPLE USAGE:
#   on:
#     pull_request:
#       types: [closed]
#       branches: [main]
#
#   jobs:
#     Release:
#       if: ${{ github.event.pull_request.merged == true }}
#       uses: gesslar/Maint/.github/workflows/ReleaseAction.yaml@main
#       secrets: inherit
#       permissions:
#         contents: write

name: Release Action (Reusable)

on:
  workflow_call:
    inputs:
      package_manager:
        type: string
        default: "auto"
      quality_check:
        description: "Name of quality check to wait for (composite: '<caller-job> / <sentinel-job>'). Empty string disables the gate."
        type: string
        default: "Quality / Quality"
      git_user_name:
        type: string
        default: "github-actions"
      git_user_email:
        type: string
        default: "github-actions@github.com"
      build_command:
        description: "Package script (run via '<pm> run <build_command>') that produces the bundled action."
        type: string
        default: "build"
      dist_path:
        description: "Path to the built action output to commit back to the repository."
        type: string
        default: "dist"

jobs:
  ConfigureWorkflow:
    runs-on: ubuntu-latest

    outputs:
      quality_check: ${{ steps.cfg_main.outputs.quality_check }}
      git_user_name: ${{ steps.cfg_main.outputs.git_user_name }}
      git_user_email: ${{ steps.cfg_main.outputs.git_user_email }}
      build_command: ${{ steps.cfg_main.outputs.build_command }}
      dist_path: ${{ steps.cfg_main.outputs.dist_path }}
      package_manager: ${{ steps.cfg_pm.outputs.package_manager }}
      pm_install_cmd: ${{ steps.cfg_pm.outputs.pm_install_cmd }}
      pm_version: ${{ steps.cfg_pm.outputs.pm_version }}
      node_version: ${{ steps.cfg_node.outputs.node_version }}

    steps:
      - name: Configure workflow
        id: cfg_main
        run: |+
          # Check repository variables, fall back to inputs
          QUALITY_CHECK="${{ vars.QUALITY_CHECK || inputs.quality_check }}"
          PACKAGE_MANAGER="${{ vars.PACKAGE_MANAGER || inputs.package_manager }}"
          GIT_USER_NAME="${{ vars.GIT_USER_NAME || inputs.git_user_name }}"
          GIT_USER_EMAIL="${{ vars.GIT_USER_EMAIL || inputs.git_user_email }}"
          BUILD_COMMAND="${{ vars.BUILD_COMMAND || inputs.build_command }}"
          DIST_PATH="${{ vars.DIST_PATH || inputs.dist_path }}"

          # Apply configuration
          echo "quality_check=${QUALITY_CHECK}" >> "$GITHUB_OUTPUT"
          echo "git_user_name=${GIT_USER_NAME}" >> "$GITHUB_OUTPUT"
          echo "git_user_email=${GIT_USER_EMAIL}" >> "$GITHUB_OUTPUT"
          echo "package_manager=${PACKAGE_MANAGER}" >> "$GITHUB_OUTPUT"
          echo "build_command=${BUILD_COMMAND}" >> "$GITHUB_OUTPUT"
          echo "dist_path=${DIST_PATH}" >> "$GITHUB_OUTPUT"
          echo "pm_default=npm" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Package Manager
        id: cfg_pm
        run: |+
          set -euo pipefail

          PM_DEFAULT="npm"
          PACKAGE_MANAGER="${{ steps.cfg_main.outputs.package_manager }}"
          PM_VERSION=""

          if [[ "$PACKAGE_MANAGER" = "auto" ]]; then
            printf "Package manager set to 'auto'.\n"
            printf "Detecting: "

            PM=$(jq -r .packageManager package.json)
            printf "PM=%s\n" "$PM"

            if [[ ! "$PM" ]]; then
              PACKAGE_MANAGER="$PM_DEFAULT"
            elif [[ "$PM" =~ ^(pnpm)@([[:digit:]]+.[[:digit:]]+.[[:digit:]]+)$ ]]; then
              PACKAGE_MANAGER="${BASH_REMATCH[1]}"
              PM_VERSION="${BASH_REMATCH[2]}"
            else
              PACKAGE_MANAGER="$PM_DEFAULT"
              PM_VERSION=""
            fi
          fi

          echo "package_manager=${PACKAGE_MANAGER}" >> "$GITHUB_OUTPUT"
          echo "pm_version=${PM_VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "$PACKAGE_MANAGER" = "pnpm" ]]; then
            echo "pm_install_cmd=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          else
            echo "pm_install_cmd=npm ci" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Node Version
        id: cfg_node
        run: |+
          set -euo pipefail

          NODE_VERSION=""

          if ! NODE_RAW=$(jq -er '.engines.node' package.json); then
            echo "::error::engines.node is required in package.json."
            exit 1
          fi

          if [[ "$NODE_RAW" =~ [^0-9]*([0-9]+) ]]; then
            NODE_VERSION="${BASH_REMATCH[1]}"
          else
            echo "::error::Unable to parse engines.node ('${NODE_RAW}') for a Node.js version."
            exit 1
          fi

          echo "node_version=${NODE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Display Configuration
        run: |+
          printf "Package Manager: %s" "${{ steps.cfg_pm.outputs.package_manager }}"

          if [[ "${{ steps.cfg_pm.outputs.package_manager }}" = "pnpm" ]]; then
            printf " (%s)\n" "${{ steps.cfg_pm.outputs.pm_version }}"
          else
            printf "\n"
          fi

          printf "Package Manager Install: %s\n" "${{ steps.cfg_pm.outputs.pm_install_cmd }}"
          printf "Node: %s\n" "${{ steps.cfg_node.outputs.node_version }}"
          printf "Build Command: %s run %s\n" "${{ steps.cfg_pm.outputs.package_manager }}" "${{ steps.cfg_main.outputs.build_command }}"
          printf "Dist Path: %s\n" "${{ steps.cfg_main.outputs.dist_path }}"

  WaitForQuality:
    needs: ConfigureWorkflow
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged == true }}
    steps:
      - name: Wait for Quality workflow
        if: ${{ inputs.quality_check != '' }}
        uses: lewagon/wait-on-check-action@v1.8.0
        with:
          ref: ${{ github.ref }}
          check-name: ${{ inputs.quality_check }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          checks-discovery-timeout: 300

  DetermineVersion:
    needs: WaitForQuality
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged == true }}
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check version
        id: check_version
        uses: gesslar/new-version-questionmark@v1.6.2
        with:
          source: package.json
          version_pattern: "^v\\d+\\.\\d+\\.\\d+$"

      - name: Set version output
        id: version
        run: |
          UPDATED_VERSION="${{ steps.check_version.outputs.updated_version }}"
          if [[ "$UPDATED_VERSION" == "no changes" ]]; then
            echo "VERSION=🙅🏻‍♂️" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${UPDATED_VERSION}" >> "$GITHUB_OUTPUT"
          fi

  BuildTagRelease:
    needs: [ConfigureWorkflow, DetermineVersion]
    if: ${{ needs.DetermineVersion.outputs.version != '🙅🏻‍♂️' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.DetermineVersion.outputs.version }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Git Variables
        run: |+
          git config user.name "${{ needs.ConfigureWorkflow.outputs.git_user_name }}"
          git config user.email "${{ needs.ConfigureWorkflow.outputs.git_user_email }}"

      - name: Check for existing tag
        id: check_tag
        run: |+
          git fetch --tags

          if git tag -l "v${VERSION}" | grep -q "^v${VERSION}$"; then
            echo "Tag v${VERSION} already exists. Skipping release."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag v${VERSION} does not exist. Proceeding with release."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pnpm
        if: ${{ steps.check_tag.outputs.proceed == 'true' && needs.ConfigureWorkflow.outputs.package_manager == 'pnpm' }}
        uses: pnpm/action-setup@v6
        with:
          version: ${{ needs.ConfigureWorkflow.outputs.pm_version }}

      - name: Set up Node.js
        if: ${{ steps.check_tag.outputs.proceed == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.ConfigureWorkflow.outputs.node_version }}
          cache: ${{ needs.ConfigureWorkflow.outputs.package_manager }}

      - name: Install dependencies
        if: ${{ steps.check_tag.outputs.proceed == 'true' }}
        run: ${{ needs.ConfigureWorkflow.outputs.pm_install_cmd }}

      - name: Build action
        if: ${{ steps.check_tag.outputs.proceed == 'true' }}
        run: ${{ needs.ConfigureWorkflow.outputs.package_manager }} run ${{ needs.ConfigureWorkflow.outputs.build_command }}

      - name: Commit built action
        if: ${{ steps.check_tag.outputs.proceed == 'true' }}
        run: |+
          DIST_PATH="${{ needs.ConfigureWorkflow.outputs.dist_path }}"

          git add "$DIST_PATH"

          if git diff --cached --quiet; then
            echo "No changes in ${DIST_PATH}; nothing to commit."
          else
            git commit -m "Build ${DIST_PATH} for v${VERSION}"
            git push origin main
          fi

      - name: Create and push tag
        if: ${{ steps.check_tag.outputs.proceed == 'true' }}
        run: |+
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub release
        if: ${{ steps.check_tag.outputs.proceed == 'true' }}
        run: >
          gh release create "v${VERSION}"
          --title "Release v${VERSION}"
          --generate-notes
